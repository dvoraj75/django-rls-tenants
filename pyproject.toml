[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "django-rls-tenants"
version = "1.6.0"
description = "Database-enforced multitenancy for Django using PostgreSQL Row-Level Security."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Jan Dvořák" },
]
keywords = [
    "django",
    "multitenancy",
    "postgresql",
    "row-level-security",
    "rls",
    "tenants",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
]

[project.optional-dependencies]
# Native Celery integration (contrib.celery): @rls_task / RLSTask / install().
# Optional -- the core library never imports celery.
celery = [
    "celery>=5.3",
]
# Django REST Framework integration (contrib.drf): RLSTenantAPIViewMixin,
# RLSTenantPermission, RLSTenantSerializerMixin. Optional -- the core library
# never imports rest_framework.
drf = [
    "djangorestframework>=3.16",
]

# pytest plugin (django_rls_tenants.pytest_plugin): the enforce_rls fixtures.
# Loaded in every pytest run with the package installed; -p no:django_rls_tenants
# turns it off.
[project.entry-points.pytest11]
django_rls_tenants = "django_rls_tenants.pytest_plugin"

[project.urls]
Homepage = "https://github.com/dvoraj75/django-rls-tenants"
Documentation = "https://dvoraj75.github.io/django-rls-tenants/"
Repository = "https://github.com/dvoraj75/django-rls-tenants"
Issues = "https://github.com/dvoraj75/django-rls-tenants/issues"
Changelog = "https://github.com/dvoraj75/django-rls-tenants/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pre-commit>=3.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.0",
    # Types for contrib.drf; the lint job installs only this group. The django-stubs
    # plugin boots Django with tests/settings.py, whose INSTALLED_APPS lists DRF.
    "djangorestframework-stubs>=3.16",
    "djangorestframework>=3.16",
    "psycopg2-binary>=2.9",
    # mypy type-checks django_rls_tenants.pytest_plugin, which imports pytest.
    "pytest>=8.0",
]
test = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.0",
    "psycopg2-binary>=2.9",
    "celery>=5.3",
    "djangorestframework>=3.16",
    # tests/test_support_matrix.py parses the CI workflows.
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # mkdocstrings imports contrib.celery and contrib.drf to render their API reference.
    "celery>=5.3",
    "djangorestframework>=3.16",
]

# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["django_rls_tenants"]

[tool.hatch.build.targets.sdist]
include = [
    "django_rls_tenants/",
    "tests/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
# The support-matrix drift test reads .github/, docs/ and AGENTS.md, which the sdist
# does not ship.
exclude = ["tests/test_support_matrix.py"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 99
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "F",        # pyflakes
    "E", "W",   # pycodestyle
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "S",        # flake8-bandit
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez
    "T10",      # flake8-debugger
    "DJ",       # flake8-django
    "ISC",      # flake8-implicit-str-concat
    "G",        # flake8-logging-format
    "PIE",      # flake8-pie
    "T20",      # flake8-print
    "PT",       # flake8-pytest-style
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SLF",      # flake8-self
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "TCH",      # flake8-type-checking
    "ARG",      # flake8-unused-arguments
    "PL",       # pylint
    "TRY",      # tryceratops
    "FLY",      # flynt
    "PERF",     # perflint
    "RUF",      # ruff-specific
]
ignore = [
    "S608",     # SQL injection (developer-controlled RLS policy strings)
    "TRY003",   # long exception messages
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments (public API, Django signatures)
]

[tool.ruff.lint.per-file-ignores]
"django_rls_tenants/tenants/conf.py" = [
    "N802",     # uppercase property names mirror Django settings keys
]
"django_rls_tenants/tenants/testing.py" = [
    "S101",     # assert used intentionally in test assertion helpers
]
"tests/**/*.py" = [
    "S101",     # assert allowed in tests
    "ARG",      # unused arguments (fixtures)
    "SLF001",   # private member access
    "PLR2004",  # magic values
]
"**/migrations/*.py" = [
    "E501",     # line length (Django-generated)
    "I001",     # import order (Django-generated)
    "RUF012",   # mutable class defaults (Django convention)
]
"example/**/*.py" = [
    "S101",     # assert allowed in demo
    "S105",     # hardcoded secrets (demo-only)
    "ARG",      # unused arguments
    "I001",     # import order (Django demo conventions)
    "PLC0415",  # imports not at top-level (Django manage.py pattern)
    "RUF005",   # iterable unpacking vs concatenation
    "RUF012",   # mutable class defaults (Django convention)
    "T20",      # print statements (management commands)
]

[tool.ruff.lint.isort]
known-first-party = ["django_rls_tenants"]

[tool.ruff.format]
# Keep the docs' hand-aligned code examples as written.
exclude = ["*.md"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Celery is an optional dependency and ships no type information. It is not
# installed in the lint/type-check job (which syncs only the ``dev`` group), so
# tell mypy not to error on the missing stubs.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

# ``contrib.celery`` subclasses celery's ``Task``, which is typed as ``Any``
# here (celery ships no stubs and is absent from the lint env). Relax just the
# subclassing-any check for this one module; everything else stays strict and
# the module is fully annotated.
[[tool.mypy.overrides]]
module = "django_rls_tenants.contrib.celery"
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "tests.settings"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
django_find_project = false
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "integration: end-to-end tests requiring a live PostgreSQL database",
    'superuser_only: needs a PostgreSQL superuser connection; deselect with -m "not superuser_only" on a plain role',
    "psycopg3_only: needs psycopg 3 and psycopg_pool (Django's connection pool); deselected automatically on psycopg2",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["django_rls_tenants"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
