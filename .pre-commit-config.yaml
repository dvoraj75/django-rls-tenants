repos:
  - repo: local
    hooks:
      # Ruff runs from the uv-managed environment so the hook always uses the
      # exact version pinned in uv.lock -- the same one CI runs via `uv run ruff`.
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy django_rls_tenants
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: debug-statements
