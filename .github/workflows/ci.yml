name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify lockfile is up-to-date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy django_rls_tenants

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build docs
        run: uv run mkdocs build --strict

  example-smoke:
    # Consumer-project smoke test: build the wheel, install it into a clean venv
    # (never editable, never the source tree on sys.path) and run the example
    # app's checks, migration drift check and test suite against it as a
    # non-superuser role. A packaging defect (missing py.typed, a subpackage
    # without __init__.py, a stray tests/ directory) fails here instead of at
    # a user's `pip install`.
    name: Example app against the built wheel (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: demo
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      RLS_FAIL_ON_SKIPPED: "1"
      # Every example command runs with this interpreter, never `uv run`, so the
      # only importable django_rls_tenants is the one installed from the wheel.
      WHEEL_PYTHON: ${{ github.workspace }}/.wheel-venv/bin/python
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist & wheel
        run: uv build

      - name: Inspect wheel contents
        # The sdist ships tests/ on purpose; only the wheel is asserted on.
        run: |
          unzip -l dist/*.whl
          python3 - dist/*.whl <<'EOF'
          import posixpath
          import sys
          import zipfile

          package = "django_rls_tenants"
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          problems = []

          required = [
              f"{package}/__init__.py",
              f"{package}/py.typed",
              f"{package}/contrib/celery.py",
              f"{package}/management/commands/check_rls.py",
              f"{package}/management/commands/setup_m2m_rls.py",
          ]
          problems += [f"missing from wheel: {name}" for name in required if name not in names]

          # Every directory that holds a module must be an importable package.
          module_dirs = {posixpath.dirname(n) for n in names if n.endswith(".py")}
          problems += [
              f"package directory without __init__.py: {d}/"
              for d in sorted(module_dirs)
              if f"{d}/__init__.py" not in names
          ]

          # Nothing outside the package and its metadata (no tests/, example/, docs/...).
          for name in names:
              top = name.split("/", 1)[0]
              if top != package and not top.endswith(".dist-info"):
                  problems.append(f"stray path in wheel: {name}")
              if "__pycache__" in name or name.endswith(".pyc"):
                  problems.append(f"bytecode in wheel: {name}")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"wheel OK: {len(names)} files, all under {package}/ or *.dist-info/")
          EOF

      - name: Install the wheel into a clean venv (never editable)
        # Django and the test tooling come from uv.lock at their pinned versions,
        # without the project itself, so the committed example migrations match
        # the Django that generated them and the only django_rls_tenants in the
        # venv is the wheel.
        run: |
          uv venv --python 3.12 .wheel-venv
          uv export --frozen --no-default-groups --group test --no-emit-project \
            --no-hashes --no-annotate --output-file consumer-requirements.txt
          uv pip install --python .wheel-venv -r consumer-requirements.txt dist/*.whl
          # -I: isolated mode, so the checkout (cwd) is not on sys.path.
          "$WHEEL_PYTHON" -I - <<'EOF'
          import pathlib
          import sys

          import django_rls_tenants

          location = pathlib.Path(django_rls_tenants.__file__).resolve()
          venv = pathlib.Path(sys.prefix).resolve()
          print(f"django_rls_tenants {django_rls_tenants.__version__} imported from {location}")
          if not location.is_relative_to(venv):
              sys.exit(f"django_rls_tenants resolved outside the venv {venv}: {location}")
          EOF

      - name: Django system check (imports URLconf -> views -> admin, no database)
        working-directory: example
        env:
          # Keep verifying that imports work without a database connection.
          POSTGRES_PORT: "1"
        run: |
          "$WHEEL_PYTHON" manage.py check

      - name: Collect example tests (no database)
        working-directory: example
        env:
          POSTGRES_PORT: "1"
        run: |
          "$WHEEL_PYTHON" -m pytest tests/ --collect-only -q

      - name: Create a non-superuser role for RLS enforcement
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -U postgres -d demo -v ON_ERROR_STOP=1
          -c "CREATE ROLE app LOGIN PASSWORD 'app' CREATEDB"

      - name: Run example tests against the wheel with PostgreSQL RLS enforced
        working-directory: example
        run: |
          "$WHEEL_PYTHON" manage.py makemigrations --check --dry-run
          "$WHEEL_PYTHON" -m pytest tests/ -v

  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}, ${{ matrix.driver }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # The supported-versions policy (docs/getting-started/installation.md) makes
        # every Python x Django pair valid, so there are no exclude rows.
        # tests/test_support_matrix.py fails if this drifts from the docs.
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        driver: ["psycopg2"]
        include:
          # Driver-neutrality leg: the library must behave identically on psycopg 3.
          # Installed on top of the synced venv because Django prefers psycopg 3 whenever
          # it is importable; putting it in a dependency group would flip every leg.
          - python-version: "3.12"
            django-version: "6.1"
            driver: "psycopg3"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_rls_tenants_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/django_rls_tenants_test
      UV_PYTHON: ${{ matrix.python-version }}
      DJANGO_VERSION: ${{ matrix.django-version }}
      DRIVER: ${{ matrix.driver }}
      # Zero-skipped rule: a skipped RLS test must fail the leg (tests/conftest.py).
      RLS_FAIL_ON_SKIPPED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --group test
          uv pip install --python .venv/bin/python "django~=${{ matrix.django-version }}.0"
          if [ "${{ matrix.driver }}" = "psycopg3" ]; then
            uv pip install --python .venv/bin/python "psycopg[binary,pool]"
          fi

      - name: Verify matrix versions
        # Do not let uv re-sync Django to the lockfile version after the override.
        # The driver check also proves the psycopg2 legs did not silently flip.
        run: |
          uv run --no-sync python - <<'EOF'
          import os
          import sys

          import django
          from django.db.backends.postgresql.psycopg_any import is_psycopg3

          python_version = ".".join(map(str, sys.version_info[:2]))
          django_version = ".".join(map(str, django.VERSION[:2]))
          driver = "psycopg3" if is_psycopg3 else "psycopg2"
          print(
              f"Testing Python {sys.version.split()[0]}, Django {django.get_version()}, "
              f"driver {driver}"
          )
          assert python_version == os.environ["UV_PYTHON"], python_version
          assert django_version == os.environ["DJANGO_VERSION"], django_version
          assert driver == os.environ["DRIVER"], f"driver {driver}, expected {os.environ['DRIVER']}"
          EOF

      - name: Run tests
        run: uv run --no-sync python -m pytest --cov --cov-report=xml

      - name: Coverage PR comment
        # Skip on PRs from forks: they get a read-only GITHUB_TOKEN, so posting
        # the coverage comment fails with "Resource not accessible by integration"
        # and reds the whole job even when tests and coverage pass.
        if: >-
          github.event_name == 'pull_request'
          && matrix.python-version == '3.12' && matrix.django-version == '6.1'
          && matrix.driver == 'psycopg2'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.9

      - name: Upload coverage
        # Pinned to one leg: upload-artifact fails on a duplicate artifact name, and
        # 3.12 / 6.1 runs twice (psycopg2 and psycopg3).
        if: >-
          matrix.python-version == '3.12' && matrix.django-version == '6.1'
          && matrix.driver == 'psycopg2'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  test-postgres:
    # The README lists PostgreSQL 15, 16, 17 and 18; the main matrix runs 16.
    # Four extra legs prove the oldest and newest supported PostgreSQL against
    # the oldest and newest supported Django without widening the matrix above
    # (16 stays the default everywhere else).
    name: Test (PostgreSQL ${{ matrix.postgres }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
        django-version: ["5.2", "6.1"]
        include:
          - django-version: "5.2"
            python-version: "3.12"
          - django-version: "6.1"
            python-version: "3.14"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_rls_tenants_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/django_rls_tenants_test
      UV_PYTHON: ${{ matrix.python-version }}
      DJANGO_VERSION: ${{ matrix.django-version }}
      RLS_FAIL_ON_SKIPPED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --group test
          uv pip install --python .venv/bin/python "django~=${{ matrix.django-version }}.0"

      - name: Verify matrix versions
        # Do not let uv re-sync Django to the lockfile version after the override.
        run: |
          uv run --no-sync python - <<'EOF'
          import os
          import sys

          import django

          python_version = ".".join(map(str, sys.version_info[:2]))
          django_version = ".".join(map(str, django.VERSION[:2]))
          print(f"Testing Python {sys.version.split()[0]}, Django {django.get_version()}")
          assert python_version == os.environ["UV_PYTHON"], python_version
          assert django_version == os.environ["DJANGO_VERSION"], django_version
          EOF

      - name: Run tests
        run: uv run --no-sync python -m pytest
